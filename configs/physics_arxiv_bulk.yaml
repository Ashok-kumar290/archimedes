# Bulk arXiv physics metadata pull (expert #2 volume driver).
# These are metadata/abstract queries; run retrieve_seed on this file to
# populate raw/physics_arxiv_metadata_bulk/, then ingest_arxiv_papers with
# --metadata-source physics_arxiv_metadata_bulk to download full-text PDFs.
# ~4500 papers -> after pdftotext, the bulk of the ~150M physics corpus.
sources:
  - name: physics_arxiv_metadata_bulk
    domain: research
    license: arXiv metadata; paper licenses vary by record
    source_type: xml
    urls:
      - https://export.arxiv.org/api/query?search_query=cat:physics.ed-ph&start=0&max_results=100
      - https://export.arxiv.org/api/query?search_query=cat:physics.ed-ph&start=100&max_results=100
