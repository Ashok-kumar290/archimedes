# Archimedes Mathematics Dataset v0
#
# Scope:
# - math-only retrieval
# - provenance and license metadata preserved per source
# - starts with open web pages and arXiv metadata, then expands to full papers,
#   open textbooks, contest problems, and formal proof corpora.
#
# Notes:
# - Wikipedia content is CC-BY-SA.
# - arXiv API metadata is retrieved here; individual paper licenses vary and
#   must be tracked before using full PDFs/TeX sources for training.
sources:
  - name: math_wikipedia_core_topics
    domain: mathematics
    license: CC-BY-SA-4.0
    source_type: html
    urls:
      - https://en.wikipedia.org/wiki/Mathematics
      - https://en.wikipedia.org/wiki/Arithmetic
      - https://en.wikipedia.org/wiki/Algebra
      - https://en.wikipedia.org/wiki/Abstract_algebra
