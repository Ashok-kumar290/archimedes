# Larger open-source retrieval targets for Archimedes phase 1.
# Do not run the full file blindly on slow links; this is the next manifest
# to expand gradually after the seed pipeline is verified.
sources:
  - name: wikipedia_latest_articles_dump
    domain: general
    license: CC-BY-SA-4.0
    source_type: xml
    urls:
      - https://dumps.wikimedia.org/enwiki/latest/enwiki-latest-pages-articles-multistream.xml.bz2

  - name: project_gutenberg_public_domain_batch
    domain: books
    license: Public domain
    source_type: text
    urls:
      - https://www.gutenberg.org/cache/epub/11/pg11.txt
      - https://www.gutenberg.org/cache/epub/2701/pg2701.txt
      - https://www.gutenberg.org/cache/epub/1661/pg1661.txt
      - https://www.gutenberg.org/cache/epub/98/pg98.txt
      - https://www.gutenberg.org/cache/epub/345/pg345.txt

  - name: arxiv_domain_metadata_batch
    domain: research
    license: arXiv metadata; paper licenses vary by record
    source_type: xml
    urls:
      - https://export.arxiv.org/api/query?search_query=cat:math.*&start=0&max_results=100
      - https://export.arxiv.org/api/query?search_query=cat:physics.*&start=0&max_results=100
      - https://export.arxiv.org/api/query?search_query=cat:cs.*&start=0&max_results=100
      - https://export.arxiv.org/api/query?search_query=cat:q-bio.*&start=0&max_results=100

